<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Bonds - Character Archive</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'Georgia', 'serif'],
                        sans: ['Inter', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        editorial: {
                            bg: '#0d0d0f',
                            accent: '#d4af37',
                            text: '#e0e0e0',
                            dim: '#888',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0d0d0f;
            color: #e0e0e0;
            margin: 0;
            overflow: hidden;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Vue Transitions */
        .fade-slide-enter-active, .fade-slide-leave-active {
            transition: all 0.5s ease;
        }
        .fade-slide-enter-from { opacity: 0; transform: translateX(-20px); }
        .fade-slide-leave-to { opacity: 0; transform: translateX(20px); }

        .scale-fade-enter-active, .scale-fade-leave-active {
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .scale-fade-enter-from { opacity: 0; transform: scale(0.95); }
        .scale-fade-leave-to { opacity: 0; transform: scale(1.05); }

        @keyframes voice-pulse {
            0%, 100% { height: 4px; }
            50% { height: 12px; }
        }
        .voice-bar { animation: voice-pulse 0.4s infinite; }

        @keyframes waveform-pulse {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.5); }
        }
        .waveform-bar.playing { animation: waveform-pulse 0.6s infinite; }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen bg-editorial-bg text-editorial-text font-sans selection:bg-editorial-accent selection:text-editorial-bg overflow-hidden flex flex-col p-10">
        <!-- Background Atmosphere -->
        <div class="fixed inset-0 pointer-events-none overflow-hidden">
            <div 
                class="absolute -top-[10%] -left-[10%] w-[60%] h-[60%] rounded-full opacity-5 blur-[120px] transition-all duration-1000"
                :style="{ backgroundColor: selectedCharacter.color }"
            ></div>
        </div>

        <!-- Header -->
        <header class="relative z-10 flex justify-between items-end border-b border-editorial-accent/20 pb-5 mb-8">
            <h1 class="text-2xl font-serif tracking-[0.2em] uppercase text-editorial-accent">Ethereal Bonds</h1>
            <div class="text-[10px] font-bold uppercase tracking-[0.2em] text-editorial-dim">
                Volume 01 / Character Archives / 2024 Release
            </div>
        </header>

        <!-- Main Showcase -->
        <main class="relative z-10 flex-grow grid grid-cols-1 md:grid-cols-[1fr_1.2fr] gap-10 items-center">
            <!-- Character Info -->
            <div class="relative z-10">
                <transition name="fade-slide" mode="out-in">
                    <div :key="selectedCharacter.id" class="relative">
                        <div class="absolute -top-10 -left-4 font-serif text-[80px] italic text-editorial-accent/10 leading-none select-none">
                            {{ selectedCharacter.id.padStart(2, '0') }}
                        </div>
                        
                        <div class="mb-6 relative z-10">
                            <h2 class="text-6xl md:text-7xl font-serif font-bold tracking-tight leading-none mb-2 uppercase">
                                {{ selectedCharacter.name }}
                            </h2>
                            <p class="text-lg text-editorial-accent tracking-[0.3em] uppercase font-sans">
                                {{ selectedCharacter.nameJp }}
                            </p>
                        </div>

                        <p class="text-sm text-editorial-dim leading-relaxed font-sans mb-8 max-w-md text-justify">
                            {{ selectedCharacter.description }}
                        </p>

                        <div class="flex items-center gap-4">
                            <button 
                                @click="playVoice"
                                :disabled="isVoicePlaying"
                                :class="['w-11 h-11 rounded-full border flex items-center justify-center transition-all duration-500', 
                                         isVoicePlaying ? 'border-editorial-accent bg-editorial-accent text-editorial-bg' : 'border-editorial-accent text-editorial-accent hover:bg-editorial-accent/10']"
                            >
                                <template v-if="isVoicePlaying">
                                    <div class="flex gap-1 items-center h-4">
                                        <div v-for="i in 3" :key="i" class="w-1 bg-editorial-bg rounded-full voice-bar" :style="{ animationDelay: (i * 0.1) + 's' }"></div>
                                    </div>
                                </template>
                                <i v-else data-lucide="play" class="w-4 h-4 fill-current ml-1"></i>
                            </button>

                            <div class="flex items-center gap-1 h-5">
                                <div 
                                    v-for="(h, i) in [8, 14, 18, 10, 16, 12, 20, 14, 8]" 
                                    :key="i" 
                                    class="w-[2px] bg-editorial-accent rounded-full waveform-bar"
                                    :class="{ 'playing': isVoicePlaying }"
                                    :style="{ height: h + 'px', animationDelay: (i * 0.05) + 's' }"
                                ></div>
                            </div>
                            <span class="text-[11px] font-bold uppercase tracking-[0.1em] text-editorial-accent ml-2">
                                VOICE: ARCHIVE RECORD
                            </span>
                        </div>
                    </div>
                </transition>
            </div>

            <!-- Character Art -->
            <div class="relative h-full flex justify-center items-center">
                <transition name="scale-fade" mode="out-in">
                    <div
                        :key="selectedCharacter.id"
                        class="relative w-[320px] h-[520px] bg-gradient-to-b from-[#1a1a1f] to-[#2a2a35] rounded-[160px_160px_20px_20px] border border-editorial-accent/30 overflow-hidden"
                    >
                        <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_30%,rgba(212,175,55,0.1)_0%,transparent_70%)]"></div>
                        <img
                            :src="selectedCharacter.portrait"
                            :alt="selectedCharacter.name"
                            referrerpolicy="no-referrer"
                            class="w-full h-full object-cover relative z-10"
                        />
                        <div class="absolute inset-x-0 bottom-0 h-[200px] bg-gradient-to-t from-editorial-bg to-transparent z-20"></div>
                    </div>
                </transition>
                <div class="absolute right-0 top-1/2 -translate-y-1/2 w-[1px] h-32 bg-editorial-accent opacity-30"></div>
            </div>
        </main>

        <!-- Selection Grid -->
        <footer class="relative z-10 flex gap-3 mt-8 pt-5 border-t border-white/5 overflow-x-auto pb-2 custom-scrollbar">
            <button
                v-for="(char, index) in characters"
                :key="char.id"
                @click="selectedId = char.id"
                :class="['flex-shrink-0 w-[52px] h-[52px] border transition-all duration-300 flex items-center justify-center text-[10px] font-bold',
                         selectedId === char.id ? 'border-editorial-accent bg-editorial-accent text-editorial-bg' : 'border-white/10 bg-[#1a1a1f] text-editorial-dim hover:border-editorial-accent']"
            >
                {{ (index + 1).toString().padStart(2, '0') }}
            </button>
        </footer>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, nextTick } = Vue;

            { id: '1', name: 'ARIA', nameJp: 'アリア・ウィンド', title: 'The Wind Whisperer', description: '作为星辰教团的首席执政官，他背负着不可告人的禁忌。严谨的外表下隐藏着对自由的渴望。在命运的交织中，他是你最可靠的盟友，亦或是最危险的博弈者。拥有操控光影的异能，其声音如深秋寒蝉，冷冽而悠长。', portrait: 'https://picsum.photos/seed/aria/800/1200', color: '#3b82f6' },

            { id: '7', name: 'SERAPHINA', nameJp: 'セラフィナ・エンジェル', title: 'The Fallen Angel', description: '作为星辰教团的首席执政官，他背负着不可告人的禁忌。严谨的外表下隐藏着对自由的渴望。在命运的交织中，他是你最可靠的盟友，亦或是最危险的博弈者。拥有操控光影的异能，其声音如深秋寒蝉，冷冽而悠长。', portrait: 'https://picsum.photos/seed/seraphina/800/1200', color: '#fbbf24' },
            { id: '8', name: 'DANTE', nameJp: 'ダンテ・ポエット', title: 'The Cursed Poet', description: '作为星辰教团的首席执政官，他背负着不可告人的禁忌。严谨的外表下隐藏着对自由的渴望。在命运的交织中，他是你最可靠的盟友，亦或是最危险的博弈者。拥有操控光影的异能，其声音如深秋寒蝉，冷冽而悠长。', portrait: 'https://picsum.photos/seed/dante/800/1200', color: '#7c3aed' },
            { id: '9', name: 'MINA', nameJp: 'ミナ・ギア', title: 'The Clockwork Engineer', description: '作为星辰教团的首席执政官，他背负着不可告人的禁忌。严谨的外表下隐藏着对自由的渴望。在命运的交织中，他是你最可靠的盟友，亦或是最危险的博弈者。拥有操控光影的异能，其声音如深秋寒蝉，冷冽而悠长。', portrait: 'https://picsum.photos/seed/mina/800/1200', color: '#06b6d4' },
            { id: '10', name: 'VALERIUS', nameJp: 'ヴァレリウス・デューク', title: 'The Iron Duke', description: '作为星辰教团的首席执政官，他背负着不可告人的禁忌。严谨的外表下隐藏着对自由的渴望。在命运的交织中，他是你最可靠的盟友，亦或是最危险的博弈者。拥有操控光影的异能，其声音如深秋寒蝉，冷冽而悠长。', portrait: 'https://picsum.photos/seed/valerius/800/1200', color: '#451a03' },
            { id: '11', name: 'LUNA', nameJp: 'ルナ・シーフ', title: 'The Midnight Thief', description: '作为星辰教团的首席执政官，他背负着不可告人的禁忌。严谨的外表下隐藏着对自由的渴望。在命运的交织中，他是你最可靠的盟友，亦或是最危险的博弈者。拥有操控光影的异能，其声音如深秋寒蝉，冷冽而悠长。', portrait: 'https://picsum.photos/seed/luna/800/1200', color: '#312e81' },
            { id: '12', name: 'SOLAS', nameJp: 'ソラス・キング', title: 'The Sun King', description: '作为星辰教团的首席执政官，他背负着不可告人的禁忌。严谨的外表下隐藏着对自由的渴望。在命运的交织中，他是你最可靠的盟友，亦或是最危险的博弈者。拥有操控光影的异能，其声音如深秋寒蝉，冷冽而悠长。', portrait: 'https://picsum.photos/seed/solas/800/1200', color: '#f59e0b' },
            { id: '13', name: 'NYX', nameJp: 'ニクス・ヴォイド', title: 'The Void Walker', description: '作为星辰教团的首席执政官，他背负着不可告人的禁忌。严谨的外表下隐藏着对自由的渴望。在命运的交织中，他是你最可靠的盟友，亦或是最危险的博弈者。拥有操控光影的异能，其声音如深秋寒蝉，冷冽而悠长。', portrait: 'https://picsum.photos/seed/nyx/800/1200', color: '#000000' },
            { id: '14', name: 'FREYA', nameJp: 'フレイヤ・クイーン', title: 'The Valkyrie Queen', description: '作为星辰教团的首席执政官，他背负着不可告人的禁忌。严谨的外表下隐藏着对自由的渴望。在命运的交织中，他是你最可靠的盟友，亦或是最危险的博弈者。拥有操控光影的异能，其声音如深秋寒蝉，冷冽而悠长。', portrait: 'https://picsum.photos/seed/freya/800/1200', color: '#991b1b' },
            { id: '15', name: 'ZEPHYR', nameJp: 'ゼファー・ストーム', title: 'The Storm Chaser', description: '作为星辰教团的首席执政官，他背负着不可告人的禁忌。严谨的外表下隐藏着对自由的渴望。在命运的交织中，他是你最可靠的盟友，亦或是最危险的博弈者。拥有操控光影的异能，其声音如深秋寒蝉，冷冽而悠长。', portrait: 'https://picsum.photos/seed/zephyr/800/1200', color: '#0ea5e9' }
        ];

        createApp({
            setup() {
                const selectedId = ref('1');
                const isVoicePlaying = ref(false);
                const characters = ref(CHARACTERS);

                const selectedCharacter = computed(() => {
                    return characters.value.find(c => c.id === selectedId.value) || characters.value[0];
                });

                let voiceTimer = null;
                const playVoice = () => {
                    isVoicePlaying.value = true;
                    if (voiceTimer) clearTimeout(voiceTimer);
                    voiceTimer = setTimeout(() => {
                        isVoicePlaying.value = false;
                    }, 4000);
                };

                onMounted(() => {
                    lucide.createIcons();
                });

                // Re-create icons when character changes
                Vue.watch(selectedId, () => {
                    nextTick(() => {
                        lucide.createIcons();
                    });
                });

                return {
                    selectedId,
                    isVoicePlaying,
                    characters,
                    selectedCharacter,
                    playVoice
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
